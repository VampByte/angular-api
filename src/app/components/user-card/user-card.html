<article
	class="flex flex-col items-center gap-3 rounded-lg border border-slate-200 bg-white p-5 text-center shadow-sm transition hover:shadow-md">
	<img [src]="user().image" [alt]="'Foto de ' + user().first_name + ' ' + user().last_name"
		class="h-20 w-20 rounded-full object-cover" />

	<h3 class="text-base font-semibold text-slate-900">{{ user().first_name }} {{ user().last_name }}</h3>
	<p class="-mt-2 text-xs text-slate-500">{{ user().email }}</p>

	<div class="mt-2 flex w-full flex-col gap-2 sm:flex-row">
		<a [routerLink]="['/user', user()._id]"
			class="flex-1 cursor-pointer rounded-md bg-indigo-600 px-3 py-1.5 text-center text-sm font-medium text-white transition hover:bg-indigo-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
			Ver detalle
		</a>
		<a [routerLink]="['/updateuser', user()._id]"
			class="flex-1 cursor-pointer rounded-md bg-amber-500 px-3 py-1.5 text-center text-sm font-medium text-white transition hover:bg-amber-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-500">
			Actualizar
		</a>
		<button type="button" (click)="onDeleteClick()"
			class="flex-1 cursor-pointer rounded-md border border-red-600 bg-transparent px-3 py-1.5 text-sm font-medium text-red-600 transition hover:bg-red-600 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-600">
			Eliminar
		</button>
	</div>
</article>
