<article
  class="flex flex-col items-center gap-3 rounded-lg border border-slate-200 bg-white p-5 text-center shadow-sm transition hover:shadow-md"
>
  <img
    src="https://i.pravatar.cc/150"
    alt="Foto de usuario"
    class="h-20 w-20 rounded-full object-cover"
  />

  <h3 class="text-base font-semibold text-slate-900">Nombre de usuario</h3>

  <div class="mt-2 flex w-full flex-col gap-2 sm:flex-row">
    <button
      type="button"
      class="flex-1 rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-medium text-white transition hover:bg-indigo-700"
    >
      Ver detalle
    </button>
    <button
      type="button"
      class="flex-1 rounded-md bg-amber-500 px-3 py-1.5 text-sm font-medium text-white transition hover:bg-amber-600"
    >
      Actualizar
    </button>
    <button
      type="button"
      class="flex-1 rounded-md bg-red-600 px-3 py-1.5 text-sm font-medium text-white transition hover:bg-red-700"
    >
      Borrar
    </button>
  </div>
