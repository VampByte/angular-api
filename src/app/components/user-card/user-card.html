<article
  class="flex flex-col items-center gap-3 rounded-lg border border-slate-200 bg-white p-5 text-center shadow-sm transition hover:shadow-md"
>
  <img
    [src]="avatarUrl()"
    [alt]="'Foto de ' + name()"
    class="h-20 w-20 rounded-full object-cover"
  />

  <h3 class="text-base font-semibold text-slate-900">{{ name() }}</h3>
  <p class="-mt-2 text-xs text-slate-500">{{ email() }}</p>

  <div class="mt-2 flex w-full flex-col gap-2 sm:flex-row">
    <button
      type="button"
      class="flex-1 rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-medium text-white transition hover:bg-indigo-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
    >
      Ver detalle
    </button>
    <button
      type="button"
      class="flex-1 rounded-md bg-amber-500 px-3 py-1.5 text-sm font-medium text-white transition hover:bg-amber-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-500"
    >
      Actualizar
    </button>
    <button
      type="button"
      class="flex-1 rounded-md border border-red-600 bg-transparent px-3 py-1.5 text-sm font-medium text-red-600 transition hover:bg-red-600 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-600"
    >
      Eliminar
    </button>
  </div>
</article>
