<div class="mx-auto max-w-xl rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="mb-1 text-xl font-bold text-slate-900">
    {{ isEditMode() ? 'Actualizar usuario' : 'Nuevo usuario' }}
  </h1>
  <p class="mb-6 text-sm text-slate-500">
    Formulario con validaciones y conexión al API (fase 3/4).
  </p>

  <form class="flex flex-col gap-4">
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Nombre</label>
      <input
        type="text"
        disabled
        placeholder="Nombre completo"
        class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm disabled:bg-slate-50"
      />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Email</label>
      <input
        type="email"
        disabled
        placeholder="correo@ejemplo.com"
        class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm disabled:bg-slate-50"
      />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">URL de imagen</label>
      <input
        type="text"
        disabled
        placeholder="https://..."
        class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm disabled:bg-slate-50"
      />
    </div>

    <button
      type="button"
      disabled
      class="mt-2 rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-700 disabled:opacity-50"
    >
      {{ isEditMode() ? 'Actualizar' : 'Guardar' }}
    </button>
  </form>
</div>
