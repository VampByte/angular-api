<div class="mx-auto max-w-2xl rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
	<div class="flex flex-col items-center gap-1 text-center">
		<img src="https://i.pravatar.cc/150" alt="Foto de usuario" class="h-28 w-28 rounded-full object-cover" />
		<h1 class="mt-2 text-xl font-bold text-slate-900">Nombre de usuario</h1>
		<p class="text-xs text-slate-400">ID: {{ id() }}</p>
		<p class="mt-1 text-sm text-slate-500">
			Aquí se mostrarán todos los datos del usuario (fase 3).
		</p>
	</div>

	<div class="mt-8 flex flex-col gap-2 sm:flex-row">
		<a routerLink="/home"
			class="flex-1 rounded-md border border-slate-300 px-4 py-2 text-center text-sm font-medium text-slate-700 transition hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-400">
			Volver al listado
		</a>
		<a [routerLink]="['/updateuser', id()]"
			class="flex-1 rounded-md bg-amber-500 px-4 py-2 text-center text-sm font-medium text-white transition hover:bg-amber-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-500">
			Actualizar
		</a>
		<button type="button"
			class="flex-1 rounded-md border border-red-600 bg-transparent px-4 py-2 text-sm font-medium text-red-600 transition hover:bg-red-600 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-600">
			Eliminar
		</button>
	</div>
</div>
