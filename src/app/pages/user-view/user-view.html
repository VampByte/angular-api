<div class="mx-auto max-w-2xl rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
  <div class="flex flex-col items-center gap-3 text-center">
    <img
      src="https://i.pravatar.cc/150"
      alt="Foto de usuario"
      class="h-28 w-28 rounded-full object-cover"
    />
    <h1 class="text-xl font-bold text-slate-900">Detalle de usuario #{{ id() }}</h1>
    <p class="text-sm text-slate-500">
      Aquí se mostrarán todos los datos del usuario (fase 3).
    </p>
  </div>

  <div class="mt-8 flex flex-col gap-2 sm:flex-row">
    <a
      routerLink="/home"
      class="flex-1 rounded-md border border-slate-300 px-4 py-2 text-center text-sm font-medium text-slate-700 transition hover:bg-slate-50"
    >
      Volver al listado
    </a>
    <a
      [routerLink]="['/updateuser', id()]"
      class="flex-1 rounded-md bg-amber-500 px-4 py-2 text-center text-sm font-medium text-white transition hover:bg-amber-600"
    >
      Actualizar
    </a>
    <button
      type="button"
      class="flex-1 rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-red-700"
    >
      Eliminar
    </button>
  </div>
</div>
